name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: typix-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      # optimised build (R8 shrunk, no debug code): smaller and a little faster. Same signing key, so it installs over the debug one.
      - run: gradle assembleRelease
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: typix-release-apk, path: app/build/outputs/apk/release/*.apk, if-no-files-found: ignore }
